  names:
    kind: Heartbeat
    listKind: HeartbeatList
    plural: heartbeats
    shortNames:
    - hb
    singular: heartbeat
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.period
      name: Period
      type: string
    - jsonPath: .spec.grace
      name: Grace
      type: string
    - jsonPath: .status.lastPingTime
      name: Last Ping
      type: date
    - jsonPath: .status.lastResult
      name: Last Result
      type: string
    - jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HeartbeatSpec configures an inbound check-in endpoint for jobs that report
              liveness by pinging the operator.
            properties:
              depends:
                description: Depends lists same-namespace checks whose failure suppresses
                  this heartbeat.
                items:
                  description: |-
                    DependencyRef points to another synthetics.dev CR in the same namespace.
                    Failures on the owning probe or test are suppressed from alerting metrics
                    when any transitive dep in this list is currently unhealthy — see the
                    `synthetics_probe_suppressed` / `synthetics_test_suppressed` gauges.
                  properties:
                    kind:
                      description: DependencyKind is the CRD kind for a DependencyRef
                        target.
                      enum:
                      - HTTPProbe
                      - DNSProbe
                      - TCPProbe
                      - K6Test
                      - PlaywrightTest
                      - Heartbeat
                      type: string
                    name:
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              grace:
                description: Grace is extra slack after Period before the heartbeat
                  is down. Defaults to Period.
                type: string
              metricLabels:
                additionalProperties:
                  type: string
                description: MetricLabels are appended to every metric emitted for
                  this heartbeat.
                type: object
              period:
                description: Period is how often a ping is expected. Required.
                type: string
              suspend:
                description: Suspend stops emitting heartbeat metrics without rotating
                  the token.
                type: boolean
              tokenSecretRef:
                description: TokenSecretRef adopts an existing token Secret instead
                  of generating one.
