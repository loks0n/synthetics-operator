              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "max by (name, kind, namespace, url) (((time() - (synthetics_probe_last_run_timestamp{namespace=~\"$namespace\", kind=~\"$kind\"} or synthetics_test_last_run_timestamp{namespace=~\"$namespace\", kind=~\"$kind\"})) + on (name, namespace, kind) group_left (result, failed_assertion) (synthetics_probe_result_info{namespace=~\"$namespace\", kind=~\"$kind\"} or synthetics_test_result_info{namespace=~\"$namespace\", kind=~\"$kind\"})) and on (name, namespace, kind) ((synthetics_probe{namespace=~\"$namespace\", kind=~\"$kind\"} or synthetics_test{namespace=~\"$namespace\", kind=~\"$kind\"}) == 0))",
              "format": "table",
              "instant": true
