---
apiVersion: v1
data:
  synthetics-dns.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [{
        "title": "Overview",
        "url": "/d/synthetics-overview",
        "type": "link",
        "icon": "arrow-left",
        "targetBlank": false
      }],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["synthetics"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(synthetics_probe_last_run_timestamp{kind=\"DNSProbe\"}, namespace)", "refId": "A"},
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "probe",
            "label": "Probe",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(synthetics_probe_last_run_timestamp{namespace=\"$namespace\", kind=\"DNSProbe\"}, name)", "refId": "A"},
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "time": {"from": "now-3h", "to": "now"},
      "timepicker": {"refresh_intervals": ["10s", "30s", "1m", "5m"]},
      "timezone": "browser",
      "title": "Synthetics / DNS",
      "uid": "synthetics-DNSProbe",
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "Status",
          "description": "Last run result.",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 5, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "max(synthetics_probe{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"})"}],
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]},
              "mappings": [
                {"type": "value", "options": {"0": {"text": "FAIL", "color": "red", "index": 0}}},
                {"type": "value", "options": {"1": {"text": "PASS", "color": "green", "index": 1}}}
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Failed assertion",
          "description": "Which named assertion produced the failure, if any.",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 7, "x": 5, "y": 0},
          "targets": [{"refId": "A", "expr": "synthetics_probe_result_info{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"}", "format": "table", "instant": true}],
          "transformations": [
            {"id": "organize", "options": {"renameByName": {"failed_assertion": "Failed assertion"}}},
            {"id": "filterFieldsByName", "options": {"include": {"names": ["Failed assertion"]}}}
          ],
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "/.*/"}},
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "text"}, "noValue": "—"}}
        },
        {
          "id": 3,
          "title": "Last run",
          "description": "How long ago the last result was recorded.",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
          "targets": [{"refId": "A", "expr": "time() - max(synthetics_probe_last_run_timestamp{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"})"}],
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "s", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 120}, {"color": "red", "value": 600}]}}}
        },
        {
          "id": 4,
          "title": "Duration",
          "description": "Duration of the last probe run.",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
          "targets": [{"refId": "A", "expr": "max(synthetics_probe_duration_ms{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"})"}],
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "center", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "ms", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 200}, {"color": "red", "value": 1000}]}}}
        },
        {
          "id": 5,
          "title": "State history",
          "description": "Pass/fail over the dashboard window.",
          "type": "status-history",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 5},
          "maxDataPoints": 200,
          "targets": [{"refId": "A", "expr": "min by () (min_over_time(synthetics_probe{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"}[$__interval]))", "legendFormat": "$probe", "interval": "$__interval"}],
          "options": {"showValue": "never", "legend": {"displayMode": "list", "placement": "right", "showLegend": false}, "tooltip": {"mode": "single"}, "rowHeight": 0.85, "colWidth": 0.95},
          "fieldConfig": {
            "defaults": {
              "min": 0, "max": 1,
              "mappings": [
                {"type": "value", "options": {"0": {"color": "red", "text": "FAIL", "index": 0}}},
                {"type": "value", "options": {"1": {"color": "green", "text": "OK", "index": 1}}}
              ],
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            }
          }
        },
        {
          "id": 6,
          "title": "Duration over time",
          "description": "DNS resolution time with week-over-week overlay.",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 11},
          "targets": [
            {"refId": "A", "expr": "synthetics_probe_dns_response_ms{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"}", "legendFormat": "now"},
            {"refId": "B", "expr": "synthetics_probe_dns_response_ms{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"} offset 1w", "legendFormat": "1w ago"}
          ],
          "fieldConfig": {
            "defaults": {"unit": "ms", "custom": {"fillOpacity": 15, "lineInterpolation": "smooth", "showPoints": "never"}, "color": {"mode": "palette-classic"}},
            "overrides": [{"matcher": {"id": "byName", "options": "1w ago"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "gray"}}, {"id": "custom.lineStyle", "value": {"fill": "dash"}}, {"id": "custom.fillOpacity", "value": 0}]}]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        },
        {
          "id": 7,
          "title": "Assertions",
          "description": "Pass/fail per named assertion, with expression.",
          "type": "status-history",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 11},
          "maxDataPoints": 200,
          "targets": [{"refId": "A", "expr": "min by (assertion, expr) (min_over_time(synthetics_probe_assertion_result{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"}[$__interval]))", "legendFormat": "{{assertion}} — {{expr}}", "interval": "$__interval"}],
          "options": {"showValue": "auto", "legend": {"displayMode": "table", "placement": "right", "showLegend": true}, "tooltip": {"mode": "single"}, "rowHeight": 0.8, "colWidth": 0.95},
          "fieldConfig": {
            "defaults": {
              "min": 0, "max": 1,
              "mappings": [
                {"type": "value", "options": {"0": {"color": "red", "text": "FAIL", "index": 0}}},
                {"type": "value", "options": {"1": {"color": "green", "text": "OK", "index": 1}}}
              ],
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            }
          }
        },
        {
          "id": 8,
          "title": "Answer counts",
          "description": "Answer / authority / additional RR counts from the last DNS response.",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 20},
          "targets": [
            {"refId": "A", "expr": "synthetics_probe_dns_response_answer_count{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"}", "legendFormat": "answer"},
            {"refId": "B", "expr": "synthetics_probe_dns_response_authority_count{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"}", "legendFormat": "authority"},
            {"refId": "C", "expr": "synthetics_probe_dns_response_additional_count{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"}", "legendFormat": "additional"}
          ],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"fillOpacity": 15, "lineInterpolation": "stepAfter", "showPoints": "never"}}},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        },
        {
          "id": 9,
          "title": "First answer",
          "description": "Value + type of the first record in the answer section. Useful for spotting DNS record drift.",
          "type": "table",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 20},
          "targets": [{
            "refId": "A",
            "expr": "synthetics_probe_dns_response_first_answer_value{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"} * on (namespace, name) group_left (type) synthetics_probe_dns_response_first_answer_type{namespace=\"$namespace\", kind=\"DNSProbe\", name=\"$probe\"}",
            "format": "table",
            "instant": true
          }],
          "transformations": [{"id": "filterFieldsByName", "options": {"include": {"names": ["value", "type"]}}}],
          "options": {"showHeader": true},
          "fieldConfig": {"defaults": {"custom": {"align": "left"}}}
        }
      ]
    }
kind: ConfigMap
metadata:
  creationTimestamp: null
  labels:
    grafana_dashboard: "1"
  name: synthetics-dns-dashboard
  namespace: monitoring
---
apiVersion: v1
data:
  synthetics-heartbeat.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "synthetics",
        "heartbeat"
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(synthetics_heartbeat, namespace)",
              "refId": "A"
            },
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "multi": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Synthetics / Heartbeats",
      "uid": "synthetics-Heartbeat",
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "Heartbeats",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(synthetics_heartbeat{namespace=~\"$namespace\"}) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Healthy",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(synthetics_heartbeat{namespace=~\"$namespace\"} == 1) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Missed",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(synthetics_heartbeat_result_info{namespace=~\"$namespace\", result=\"missed\"}) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Reported failure",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(synthetics_heartbeat_result_info{namespace=~\"$namespace\", result=\"reported_failure\"}) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "Pending",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(synthetics_heartbeat_result_info{namespace=~\"$namespace\", result=\"pending\"}) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "blue",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "Pings / min",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(synthetics_heartbeat_received_total{namespace=~\"$namespace\"}[5m])) * 60 or vector(0)"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "title": "Fleet",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "synthetics_heartbeat_result_info{namespace=~\"$namespace\"}"
            },
            {
              "refId": "B",
              "format": "table",
              "instant": true,
              "expr": "(time() - (synthetics_heartbeat_last_received_timestamp{namespace=~\"$namespace\"} > 0))"
            },
            {
              "refId": "C",
              "format": "table",
              "instant": true,
              "expr": "(synthetics_heartbeat_expected_period_seconds{namespace=~\"$namespace\"} + synthetics_heartbeat_grace_seconds{namespace=~\"$namespace\"})"
            },
            {
              "refId": "D",
              "format": "table",
              "instant": true,
              "expr": "(time() - (synthetics_heartbeat_last_received_timestamp{namespace=~\"$namespace\"} > 0)) / (synthetics_heartbeat_expected_period_seconds{namespace=~\"$namespace\"} + synthetics_heartbeat_grace_seconds{namespace=~\"$namespace\"})"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "name",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "__name__ 1": true,
                  "__name__ 2": true,
                  "__name__ 3": true,
                  "__name__ 4": true,
                  "job 1": true,
                  "job 2": true,
                  "job 3": true,
                  "job 4": true,
                  "instance 1": true,
                  "instance 2": true,
                  "instance 3": true,
                  "instance 4": true,
                  "kind 1": true,
                  "kind 2": true,
                  "kind 3": true,
                  "kind 4": true,
                  "container 1": true,
                  "container 2": true,
                  "container 3": true,
                  "container 4": true,
                  "endpoint 1": true,
                  "endpoint 2": true,
                  "endpoint 3": true,
                  "endpoint 4": true,
                  "pod 1": true,
                  "pod 2": true,
                  "pod 3": true,
                  "pod 4": true,
                  "service 1": true,
                  "service 2": true,
                  "service 3": true,
                  "service 4": true,
                  "namespace 2": true,
                  "namespace 3": true,
                  "namespace 4": true,
                  "team 2": true,
                  "team 3": true,
                  "team 4": true,
                  "region 2": true,
                  "region 3": true,
                  "region 4": true,
                  "Value #A": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "kind": true,
                  "container": true,
                  "endpoint": true,
                  "pod": true,
                  "service": true,
                  "Time": true
                },
                "renameByName": {
                  "name": "Heartbeat",
                  "namespace 1": "Namespace",
                  "result": "Result",
                  "team 1": "Team",
                  "region 1": "Region",
                  "Value #B": "Last ping",
                  "Value #C": "Window",
                  "Value #D": "Overdue"
                },
                "indexByName": {
                  "name": 0,
                  "namespace 1": 1,
                  "team 1": 2,
                  "region 1": 3,
                  "result": 4,
                  "Value #B": 5,
                  "Value #C": 6,
                  "Value #D": 7
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Overdue",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Result"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "ok": {
                            "color": "green",
                            "index": 0
                          },
                          "missed": {
                            "color": "red",
                            "index": 1
                          },
                          "reported_failure": {
                            "color": "orange",
                            "index": 2
                          },
                          "pending": {
                            "color": "blue",
                            "index": 3
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last ping"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Window"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Overdue"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "gradient"
                    }
                  },
                  {
                    "id": "max",
                    "value": 1.5
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 0.8
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "footer": {
              "show": false
            }
          }
        },
        {
          "id": 8,
          "title": "Availability",
          "type": "state-timeline",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "expr": "synthetics_heartbeat{namespace=~\"$namespace\"}",
              "legendFormat": "{{name}}"
            }
          ],
          "options": {
            "mergeValues": true,
            "showValue": "never",
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "color": "red",
                      "text": "DOWN",
                      "index": 0
                    },
                    "1": {
                      "color": "green",
                      "text": "UP",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "title": "Overdue, as a fraction of the allowed window",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 25
          },
          "description": "1.0 is the deadline \u2014 period + grace since the last ping. Crossing it is exactly when synthetics_heartbeat flips to 0.",
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{name}}",
              "expr": "(time() - (synthetics_heartbeat_last_received_timestamp{namespace=~\"$namespace\"} > 0)) / (synthetics_heartbeat_expected_period_seconds{namespace=~\"$namespace\"} + synthetics_heartbeat_grace_seconds{namespace=~\"$namespace\"})"
            }
          ],
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "max": 2
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "title": "Pings received",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 25
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{name}} \u2014 {{outcome}}",
              "expr": "sum by (name, outcome) (rate(synthetics_heartbeat_received_total{namespace=~\"$namespace\"}[5m])) * 60"
            }
          ],
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  creationTimestamp: null
  labels:
    grafana_dashboard: "1"
  name: synthetics-heartbeat-dashboard
  namespace: monitoring
---
apiVersion: v1
data:
  synthetics-http.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [{
        "title": "Overview",
        "url": "/d/synthetics-overview",
        "type": "link",
        "icon": "arrow-left",
        "targetBlank": false
      }],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["synthetics"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(synthetics_probe_last_run_timestamp{kind=\"HTTPProbe\"}, namespace)", "refId": "A"},
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "probe",
            "label": "Probe",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(synthetics_probe_last_run_timestamp{namespace=\"$namespace\", kind=\"HTTPProbe\"}, name)", "refId": "A"},
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "time": {"from": "now-3h", "to": "now"},
      "timepicker": {"refresh_intervals": ["10s", "30s", "1m", "5m"]},
      "timezone": "browser",
      "title": "Synthetics / HTTP",
      "uid": "synthetics-HTTPProbe",
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "Status",
          "description": "Last run result.",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "max(synthetics_probe{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"})"}],
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]},
              "mappings": [
                {"type": "value", "options": {"0": {"text": "FAIL", "color": "red", "index": 0}}},
                {"type": "value", "options": {"1": {"text": "PASS", "color": "green", "index": 1}}}
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Failed assertion",
          "description": "Which named assertion produced the failure, if any.",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 4, "y": 0},
          "targets": [{"refId": "A", "expr": "synthetics_probe_result_info{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"}", "format": "table", "instant": true}],
          "transformations": [
            {"id": "organize", "options": {"renameByName": {"failed_assertion": "Failed assertion"}}},
            {"id": "filterFieldsByName", "options": {"include": {"names": ["Failed assertion"]}}}
          ],
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "/.*/"}},
          "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "text"}, "noValue": "—"}}
        },
        {
          "id": 3,
          "title": "Last run",
          "description": "How long ago the last result was recorded.",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 4, "x": 10, "y": 0},
          "targets": [{"refId": "A", "expr": "time() - max(synthetics_probe_last_run_timestamp{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"})"}],
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "s", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 120}, {"color": "red", "value": 600}]}}}
        },
        {
          "id": 4,
          "title": "Duration",
          "description": "Duration of the last probe run.",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 4, "x": 14, "y": 0},
          "targets": [{"refId": "A", "expr": "max(synthetics_probe_duration_ms{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"})"}],
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "center", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "ms", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1000}, {"color": "red", "value": 5000}]}}}
        },
        {
          "id": 5,
          "title": "TLS expiry",
          "description": "Days until the served TLS certificate expires. HTTPS probes only.",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
          "targets": [{"refId": "A", "expr": "(max(synthetics_probe_tls_cert_expiry_timestamp_seconds{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"}) - time()) / 86400"}],
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"unit": "d", "decimals": 1, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 7}, {"color": "yellow", "value": 30}, {"color": "green", "value": 90}]}, "noValue": "—"}}
        },
        {
          "id": 6,
          "title": "State history",
          "description": "Pass/fail over the dashboard window. Any failure inside a bucket marks it red.",
          "type": "status-history",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 5},
          "maxDataPoints": 200,
          "targets": [{"refId": "A", "expr": "min by () (min_over_time(synthetics_probe{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"}[$__interval]))", "legendFormat": "$probe", "interval": "$__interval"}],
          "options": {"showValue": "never", "legend": {"displayMode": "list", "placement": "right", "showLegend": false}, "tooltip": {"mode": "single"}, "rowHeight": 0.85, "colWidth": 0.95},
          "fieldConfig": {
            "defaults": {
              "min": 0, "max": 1,
              "mappings": [
                {"type": "value", "options": {"0": {"color": "red", "text": "FAIL", "index": 0}}},
                {"type": "value", "options": {"1": {"color": "green", "text": "OK", "index": 1}}}
              ],
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            }
          }
        },
        {
          "id": 7,
          "title": "Duration over time",
          "description": "Probe duration with week-over-week overlay.",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 11},
          "targets": [
            {"refId": "A", "expr": "synthetics_probe_duration_ms{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"}", "legendFormat": "now"},
            {"refId": "B", "expr": "synthetics_probe_duration_ms{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"} offset 1w", "legendFormat": "1w ago"}
          ],
          "fieldConfig": {
            "defaults": {"unit": "ms", "custom": {"fillOpacity": 15, "lineInterpolation": "smooth", "showPoints": "never"}, "color": {"mode": "palette-classic"}},
            "overrides": [{"matcher": {"id": "byName", "options": "1w ago"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "gray"}}, {"id": "custom.lineStyle", "value": {"fill": "dash"}}, {"id": "custom.fillOpacity", "value": 0}]}]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        },
        {
          "id": 8,
          "title": "Assertions",
          "description": "Pass/fail per named assertion, with expression.",
          "type": "status-history",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 11},
          "maxDataPoints": 200,
          "targets": [{"refId": "A", "expr": "min by (assertion, expr) (min_over_time(synthetics_probe_assertion_result{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"}[$__interval]))", "legendFormat": "{{assertion}} — {{expr}}", "interval": "$__interval"}],
          "options": {"showValue": "auto", "legend": {"displayMode": "table", "placement": "right", "showLegend": true}, "tooltip": {"mode": "single"}, "rowHeight": 0.8, "colWidth": 0.95},
          "fieldConfig": {
            "defaults": {
              "min": 0, "max": 1,
              "mappings": [
                {"type": "value", "options": {"0": {"color": "red", "text": "FAIL", "index": 0}}},
                {"type": "value", "options": {"1": {"color": "green", "text": "OK", "index": 1}}}
              ],
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            }
          }
        },
        {
          "id": 9,
          "title": "Phase breakdown",
          "description": "Time spent in each HTTP phase. DNS = local resolution, TLS = handshake, processing = server think time, transfer = body download.",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 20},
          "targets": [{"refId": "A", "expr": "synthetics_probe_http_phase_duration_ms{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"}", "legendFormat": "{{phase}}"}],
          "fieldConfig": {
            "defaults": {"unit": "ms", "custom": {"fillOpacity": 40, "lineInterpolation": "smooth", "showPoints": "never", "stacking": {"mode": "normal", "group": "A"}}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "dns"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "purple"}}]},
              {"matcher": {"id": "byName", "options": "connect"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "blue"}}]},
              {"matcher": {"id": "byName", "options": "tls"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]},
              {"matcher": {"id": "byName", "options": "processing"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]},
              {"matcher": {"id": "byName", "options": "transfer"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "yellow"}}]}
            ]
          },
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]}}
        },
        {
          "id": 10,
          "title": "Status code",
          "description": "HTTP response status over time.",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 20},
          "targets": [{"refId": "A", "expr": "synthetics_probe_http_status_code{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"}", "legendFormat": "status"}],
          "fieldConfig": {
            "defaults": {
              "unit": "short", "min": 0, "max": 600,
              "custom": {"lineInterpolation": "stepAfter", "fillOpacity": 20, "showPoints": "always"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 300}, {"color": "red", "value": 400}, {"color": "dark-red", "value": 500}]},
              "color": {"mode": "thresholds"}
            }
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        },
        {
          "id": 11,
          "title": "HTTP info",
          "description": "Request method + negotiated HTTP version for this probe.",
          "type": "table",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 29},
          "targets": [{
            "refId": "A",
            "expr": "synthetics_probe_http_version{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"} * on (namespace, kind, name) group_left (method) synthetics_probe_http_info{namespace=\"$namespace\", kind=\"HTTPProbe\", name=\"$probe\"}",
            "format": "table",
            "instant": true
          }],
          "transformations": [
            {"id": "filterFieldsByName", "options": {"include": {"names": ["method", "url", "Value"]}}},
            {"id": "organize", "options": {"renameByName": {"Value": "http_version"}, "indexByName": {"method": 0, "url": 1, "http_version": 2}}}
          ],
          "options": {"showHeader": true},
          "fieldConfig": {"defaults": {"custom": {"align": "left"}}}
        }
      ]
    }
kind: ConfigMap
metadata:
  creationTimestamp: null
  labels:
    grafana_dashboard: "1"
  name: synthetics-http-dashboard
  namespace: monitoring
