          "targets": [
            {
              "refId": "A",
              "expr": "count((synthetics_probe{namespace=~\"$namespace\", kind=~\"$kind\"} or synthetics_test{namespace=~\"$namespace\", kind=~\"$kind\"}) == 1) OR on() vector(0)"
            }
          ],
          "options": {
