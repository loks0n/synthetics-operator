{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "synthetics-operator.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "synthetics-operator.name" . }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "synthetics-operator.name" . }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      # Every series here describes some *other* object — a probe in some
      # namespace, not the metrics pod that happens to expose it. Without
      # this, Prometheus overwrites the `namespace` label with the scraped
      # pod's own namespace and renames the real one to
      # `exported_namespace`, which silently breaks the namespace variable in
      # every shipped dashboard and every alert rule that selects on it.
      honorLabels: {{ .Values.metrics.serviceMonitor.honorLabels }}
{{- end }}
