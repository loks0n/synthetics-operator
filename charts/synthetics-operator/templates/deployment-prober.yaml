apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synthetics-operator.fullname" . }}-prober
spec:
  {{- /* Omitted under autoscaling so `helm upgrade` doesn't stomp the
         replica count KEDA is managing. */}}
  {{- if not .Values.prober.autoscaling.enabled }}
  replicas: {{ .Values.prober.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "synthetics-operator.name" . }}
      app.kubernetes.io/component: prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "synthetics-operator.name" . }}
        app.kubernetes.io/component: prober
    spec:
{{- include "synthetics-operator.podScheduling" . | indent 6 }}
      serviceAccountName: {{ include "synthetics-operator.fullname" . }}-prober
      containers:
        - name: prober
          image: {{ include "synthetics-operator.componentImage" (dict "ctx" . "image" .Values.prober.image) | quote }}
          imagePullPolicy: {{ .Values.prober.image.pullPolicy }}
          args:
            - --nats-url={{ include "synthetics-operator.natsURL" . }}
          ports:
            - name: healthz
              containerPort: 8081
            - name: metrics
              containerPort: 8082
          resources:
{{ toYaml .Values.prober.resources | indent 12 }}
