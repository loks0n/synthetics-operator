{{- if .Values.heartbeat.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synthetics-operator.fullname" . }}-heartbeat
  labels:
    app.kubernetes.io/name: {{ include "synthetics-operator.name" . }}
    app.kubernetes.io/component: heartbeat
# No ClusterRole is bound to this account. The receiver learns everything it
# needs from NATS, so the internet-facing component holds no Kubernetes
# permissions at all.
{{- end }}
