{{- if and .Values.nats.enabled (not .Values.nats.externalUrl) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "synthetics-operator.fullname" . }}-nats
spec:
  replicas: {{ .Values.nats.replicas }}
  # Stable pod DNS names — the routes below address peers as
  # <fullname>-nats-0.<fullname>-nats-headless, which a Deployment's random
  # pod names can't provide. No volumes: without JetStream, NATS holds
  # nothing worth persisting.
  serviceName: {{ include "synthetics-operator.fullname" . }}-nats-headless
  # Peers discover each other through the headless Service, so there's no
  # reason to start them one at a time.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "synthetics-operator.name" . }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "synthetics-operator.name" . }}
        app.kubernetes.io/component: nats
    spec:
{{- include "synthetics-operator.podScheduling" . | indent 6 }}
      serviceAccountName: {{ include "synthetics-operator.fullname" . }}-nats
      containers:
        - name: nats
          image: {{ .Values.nats.image | quote }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Override the stock image defaults (cluster `my_cluster`, random
          # server name) with legible values. Bypasses the built-in config
          # file — only flag-settable options live here, so we accept NATS's
          # built-in defaults for the rest (no JetStream, no auth, 1MB max
          # payload). For anything larger, switch to nats.externalUrl and
          # run NATS with a real config file.
          #
          # --cluster + --routes form a full mesh across replicas: every
          # server sees every subject, so queue-group subscribers (prober,
          # metrics) load-balance correctly no matter which server the
          # client Service happened to route them to.
          args:
            - --name=$(POD_NAME)
            - --cluster_name={{ .Values.nats.clusterName }}
            - --port=4222
            - --http_port=8222
            - --cluster=nats://0.0.0.0:6222
            - --routes={{ include "synthetics-operator.natsRoutes" . }}
          ports:
            - name: client
              containerPort: 4222
            - name: cluster
              containerPort: 6222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: monitor
            periodSeconds: 10
            failureThreshold: 3
          resources:
{{ toYaml .Values.nats.resources | indent 12 }}
{{- end }}
