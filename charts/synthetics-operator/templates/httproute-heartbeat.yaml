{{- if and .Values.heartbeat.enabled .Values.heartbeat.httpRoute.enabled }}
{{/*
Path-based routing on a single hostname, deliberately not a wildcard
subdomain per heartbeat. A token in the hostname is sent in cleartext twice
before the connection is encrypted — once in the DNS query, once in the TLS
SNI extension — which would publish every token to any recursive resolver and
to anyone reading packets on the wire. On a path it never leaves the TLS
session. One A record, one ordinary certificate.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "synthetics-operator.fullname" . }}-heartbeat
  labels:
    app.kubernetes.io/name: {{ include "synthetics-operator.name" . }}
    app.kubernetes.io/component: heartbeat
{{- with .Values.heartbeat.httpRoute.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  parentRefs:
{{ toYaml .Values.heartbeat.httpRoute.parentRefs | indent 4 }}
  hostnames:
    - {{ required "heartbeat.httpRoute.hostname is required when heartbeat.httpRoute.enabled is true" .Values.heartbeat.httpRoute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "synthetics-operator.fullname" . }}-heartbeat
          port: 8080
{{- end }}
