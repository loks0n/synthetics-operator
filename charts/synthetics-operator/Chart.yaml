apiVersion: v2
name: synthetics-operator
description: Kubernetes operator for unified synthetic monitoring — HTTPProbe, DNSProbe, TCPProbe, K6Test, PlaywrightTest, Heartbeat. Results exported to Prometheus; no proprietary store.
type: application
version: 0.2.0
appVersion: "0.2.0"
home: https://github.com/loks0n/synthetics-operator
sources:
  - https://github.com/loks0n/synthetics-operator
keywords:
  - synthetic-monitoring
  - prometheus
  - observability
  - tcp-monitoring
  - heartbeat
  - cron-monitoring
  - playwright
  - k6
maintainers:
  - name: loks0n
    url: https://github.com/loks0n
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: added
      description: Heartbeat CRD for inbound liveness checks on cron jobs, backups, and workers
    - kind: added
      description: synthetics-operator-heartbeat deployment serving the ping endpoint, with an optional Gateway API HTTPRoute
    - kind: added
      description: synthetics_heartbeat* metric family, evaluated at scrape time against period + grace
