# Scheduling applied to every component pod (deployments + bundled NATS).
imagePullSecrets: []
nodeSelector: {}
tolerations: []

# Controller Deployment.
#
# Runs reconcilers + the NATS scheduler + the event notifier. Publishes
# spec updates and probe jobs onto NATS; does not execute probes or serve
# /metrics — those live in the prober and metrics Deployments.
#
# Active-passive: multi-replica requires leaderElection: true so only one
# leader reconciles and dispatches jobs at a time.
controller:
  image:
    ref: ""
    repository: ghcr.io/loks0n/synthetics-operator-controller
    # Empty tag defaults to the chart AppVersion (stamped from the git tag at release).
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  leaderElection: false
  serviceAccount:
    create: true
    name: ""
  resources: {}

# Webhook Deployment. Stateless; reads its serving certificate from the
# Secret written by the controller. Scales horizontally.
webhook:
  image:
    ref: ""
    repository: ghcr.io/loks0n/synthetics-operator-webhook
    # Empty tag defaults to the chart AppVersion (stamped from the git tag at release).
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  # Elevated priority keeps the webhook available under node pressure.
  # If evicted, kubectl apply fails for all CRD types cluster-wide.
  priorityClassName: system-cluster-critical
  resources: {}

  serviceName: synthetics-operator-webhook-service
  secretName: synthetics-webhook-certs
  validatingWebhookConfigurationName: synthetics-operator-validating-webhook-configuration
  mutatingWebhookConfigurationName: synthetics-operator-mutating-webhook-configuration

# Prober Deployment.
#
# Stateless. Pulls jobs from synthetics.probes.jobs via a NATS queue group
# and executes HTTPProbe / DNSProbe / TCPProbe runs. Each job carries its own spec, so
# a new replica is useful immediately. Horizontally scalable — NATS queue
# groups load-balance jobs across replicas.
prober:
  image:
    ref: ""
    repository: ghcr.io/loks0n/synthetics-operator-prober
    # Empty tag defaults to the chart AppVersion (stamped from the git tag at release).
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources: {}
  # Optional KEDA autoscaling. Requires KEDA installed in the cluster
  # (https://keda.sh) — the chart only renders the ScaledObject.
  # When enabled, replicaCount is ignored and KEDA owns the replica count.
  #
  # `triggers` is passed through to the ScaledObject verbatim, so any KEDA
  # scaler works. The CPU default below is a safe starting point; if you run
  # Prometheus, scaling on prober queue depth or run latency generally
  # tracks probe load better.
  autoscaling:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 10
    # Both only take effect when minReplicaCount is 0 — KEDA logs a warning
    # if you set them otherwise. Left empty so they don't render.
    pollingInterval: ""
    cooldownPeriod: ""
    triggers:
      - type: cpu
        metricType: Utilization
        metadata:
          value: "70"

# Metrics Deployment.
#
# Stateless Prometheus endpoint. Subscribes to NATS spec updates + probe
# results + test results, maintains an in-memory metrics store, serves
# /metrics. Scale replicas for scrape availability — each replica holds
# identical state from the NATS stream.
metrics:
  image:
    ref: ""
    repository: ghcr.io/loks0n/synthetics-operator-metrics
    # Empty tag defaults to the chart AppVersion (stamped from the git tag at release).
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    # Keep the operator's own `namespace` / `name` labels instead of letting
    # Prometheus replace them with the scraped pod's. These series describe
    # probes, not the pod exposing them, so the metric's labels are the
    # truthful ones. Turning this off renames them to `exported_*` and breaks
    # the shipped dashboards and alert rules.
    honorLabels: true

# Heartbeat receiver Deployment.
#
# Serves the inbound ping endpoint for the Heartbeat CRD: a job outside the
# cluster calls its generated URL on every successful run, and the operator
# reports the heartbeat down when a call stops arriving. Stateless — the token
# index is rebuilt from the NATS spec stream, so it holds no Kubernetes
# permissions and scales horizontally.
#
# This is the only component exposed to the public internet. It runs as its
# own Deployment so a request storm against the ping endpoint degrades
# heartbeat ingestion and nothing else.
heartbeat:
  enabled: false
  image:
    ref: ""
    repository: ghcr.io/loks0n/synthetics-operator-heartbeat
    # Empty tag defaults to the chart AppVersion (stamped from the git tag at release).
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources: {}
  # How long a fresh replica reports unready while it waits for the spec
  # resync it requested on start. Until the token index is populated the
  # receiver answers 503 rather than 404, so a retrying client is never told
  # its perfectly valid token doesn't exist.
  warmup: 10s

  # The origin heartbeat URLs are rendered against, e.g.
  # https://heartbeats.example.com. Must match how the receiver is actually
  # published — the operator writes it into every Heartbeat's status.url and
  # token Secret, and callers copy it from there. Leave empty and URLs are
  # not rendered at all.
  baseUrl: ""

  # Gateway API HTTPRoute publishing the receiver. Set enabled: false and
  # wire your own Ingress/HTTPRoute/LoadBalancer if you don't run Gateway API.
  #
  # Note the routing shape: one hostname, path-prefix match. The token travels
  # in the path so it stays inside the TLS session. Do not switch this to a
  # wildcard subdomain per heartbeat — that leaks every token into DNS
  # queries and TLS SNI, both of which are cleartext.
  httpRoute:
    enabled: false
    # Must be the host component of baseUrl.
    hostname: ""
    annotations: {}
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: https

# NATS transports scheduled probe jobs/results and CronJob-backed test results.
#
# Two supported postures:
#
#   1. Chart-bundled NATS (nats.enabled: true, externalUrl empty) — a
#      StatefulSet, no JetStream. `replicas: 3` forms a full-mesh route
#      cluster so a single server going away doesn't stop delivery. Still
#      no persistence: messages in flight when a server dies are lost.
#      Fine for dev and small production setups.
#
#   2. External NATS (nats.enabled: false, externalUrl set) — point at a
#      NATS cluster you manage separately. The official nats-io/k8s Helm
#      chart supports proper HA with clustering and JetStream. Recommended
#      for production.
nats:
  enabled: false
  image: nats:2.10-alpine
  # Set to 3+ (odd numbers preferred) for a clustered, drain-tolerant bus.
  replicas: 1
  resources: {}
  # Human-readable cluster name — shows up in nats-server logs, monitoring
  # endpoints, and any nats tooling.
  clusterName: synthetics
  # URL the operator and test-sidecar should use. If set, the in-chart NATS
  # Deployment is skipped regardless of `enabled`. Must be reachable from
  # probe/test namespaces.
  # Example: nats://nats.nats-system.svc.cluster.local:4222
  externalUrl: ""

testSidecar:
  image: ""

k6Runner:
  image: ""

playwrightRunner:
  image: ""
